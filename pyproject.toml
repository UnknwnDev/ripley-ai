[project]
name = "ripley-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "UnknwnDev", email = "0unknwn.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "flask>=3.1.3",
    "huggingface-hub>=1.30.0",
    "ollama>=0.6.2",
    "piper-tts>=1.8.0",
    "pygame>=2.6.1",
    "realtimestt[faster-whisper,porcupine,server,sherpa-onnx,whisper-cpp]>=1.1.2",
    "speechrecognition>=3.17.0",
]

[project.scripts]
ripley-ai = "ripley_ai:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
